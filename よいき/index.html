<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H-555666 ai</title>
    
    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.2/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>
    <script>
        window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }, startup: { typeset: false } };
    </script>
    <script id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root{--primary-color:#00AABB;--bg-color:#f4f4f9;--chat-bg:#ffffff;}
        body{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin:0;padding:0;background:var(--bg-color);display:flex;justify-content:center;align-items:center;height:100vh;}

        #chat-container { width: 95%; max-width: 1400px; height: 90vh; background: var(--chat-bg); border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; position: relative;}
        #top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #fafafa; border-bottom: 1px solid #ddd; font-size: 0.9em; color: #666; }
        #clear-history-btn { background: #ff4d4f; padding: 4px 10px; font-size: 0.8em; }
        #clear-history-btn:hover { background: #d9363e; }
        
        #chat-history{flex:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:15px;}
        .message{max-width:85%;padding:12px 16px;border-radius:8px;line-height:1.6;word-wrap:break-word;}
        .message.user{align-self:flex-end;background:var(--primary-color);color:white;border-bottom-right-radius:0;}
        .message.assistant{align-self:flex-start;background:#e9ecef;color:#333;border-bottom-left-radius:0;}
        .message.system{align-self:center;background:transparent;color:#55DDEE;font-size:0.9em; text-align: center;}
        
        #input-area{display:flex;padding:15px;background:#fff;border-top:1px solid #ddd;gap:10px;}
        #user-input{flex:1;padding:12px;border:1px solid #ccc;border-radius:8px;resize:none;outline:none;font-family: inherit;}
        #user-input:focus{border-color:var(--primary-color);}
        button{padding:8px 20px;background:var(--primary-color);color:white;border:none;border-radius:8px;cursor:pointer;font-weight:bold;}
        button:hover{background:#0099AA;}
        button:disabled{background:#ccc;cursor:not-allowed;}
        
        #modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;justify-content:center;align-items:center;z-index:1000;}
        #modal-content{background:white;padding:30px;border-radius:12px;width:340px;text-align:center;}
        #modal-content input{width:80%;padding:10px;margin:10px 0;border:1px solid #ccc;border-radius:6px;text-align:center;font-size:1.1em;}
        #guest-btn { background: #888; margin-right: 10px; }
        #guest-btn:hover { background: #666; }
        
        .thought-box { margin-bottom: 10px; padding: 8px 12px; background: #f8f9fa; border-left: 4px solid #55DDEE; border-radius: 4px; font-size: 0.9em; color: #555; }
        .thought-box summary { cursor: pointer; font-weight: bold; color: #00AABB; user-select: none; }
        
        .message p { margin: 0 0 10px 0; }
        .message p:last-child { margin: 0; }
        .message a { word-break: break-all; color: #00AABB; }
        .message img { max-width: 100%; border-radius: 4px; }
        .message blockquote { border-left: 4px solid #ccc; margin: 10px 0; padding-left: 15px; color: #555; background: rgba(0,0,0,0.02); padding-top: 5px; padding-bottom: 5px; }
        .message ul, .message ol { padding-left: 25px; margin: 10px 0; }
        .message table { border-collapse: collapse; width: max-content; max-width: 100%; display: block; overflow-x: auto; margin: 10px 0; white-space: nowrap; }
        .message th, .message td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
        .message th { background-color: rgba(0,0,0,0.05); font-weight: bold; }
        .message pre { border-radius: 6px; margin: 10px 0; padding: 12px; overflow-x: auto; background: #0d1117; }
        .message pre code { background: transparent; padding: 0; color: #c9d1d9; }
        .message code { background: rgba(0,0,0,0.08); padding: 2px 5px; border-radius: 4px; font-family: Consolas, Monaco, monospace; font-size: 0.9em; }
        mjx-container { max-width: 100%; overflow-x: auto; overflow-y: hidden; }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="top-bar">
            <span id="user-info-display">未登录</span>
            <button id="clear-history-btn" style="display: none;">X</button>
        </div>
        <div id="chat-history"></div>
        <div id="input-area">
            <div style="display: flex; align-items: center; padding-right: 10px;" title="开启可附带历史记录。">
                <input type="checkbox" id="context-toggle" style="cursor: pointer;">
                <label id="context-label" for="context-toggle" style="font-size: 0.85em; color: #00AABB; cursor: pointer; user-select: none; white-space: nowrap; margin-left: 4px;">
                    上下文
                </label>
            </div>
            <textarea id="user-input" rows="2" placeholder="(按 Shift+Enter 换行，Enter 发送)..."></textarea>
            <button id="send-btn">发送</button>
        </div>
    </div>

    <!-- 验证弹窗 -->
    <div id="modal-overlay">
        <div id="modal-content">
            <h3>身份验证</h3>
            
            <input type="text" id="username-input" placeholder="请输入用户名" autocomplete="off" />
            <p style="font-size: 0.75em; color: #888; margin: 0 10px 15px; text-align: left;">
                用户名是你找到她的唯一依据，请妥善保管，不要泄露给他人。历史记录可以被随时删除。
            </p>
            
            <input type="password" id="key-suffix" maxlength="3" placeholder="统一访问密码" autocomplete="off" style="letter-spacing: 5px;" />
            <br>
            <div style="display: flex; justify-content: center; margin-top: 15px;">
                <button id="guest-btn">访客模式</button>
                <button id="save-key-btn">确认登录</button>
            </div>
        </div>
    </div>

    <script>
        // ================= 配置区 =================
        const API_URL = "https://h-56ai2.pages.dev";
        
        marked.setOptions({
            breaks: true,
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) { return hljs.highlight(code, { language: lang }).value; }
                return hljs.highlightAuto(code).value;
            }
        });
        // ==========================================

        let authMode = ""; 
        let clientToken = ""; 
        let currentUsername = "";
        let messagesHistory = []; 

        const chatHistory = document.getElementById('chat-history');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const modalOverlay = document.getElementById('modal-overlay');
        const usernameInput = document.getElementById('username-input');
        const keySuffixInput = document.getElementById('key-suffix');
        const saveKeyBtn = document.getElementById('save-key-btn');
        const guestBtn = document.getElementById('guest-btn');
        const contextToggle = document.getElementById('context-toggle');
        const contextLabel = document.getElementById('context-label');
        const userInfoDisplay = document.getElementById('user-info-display');
        const clearHistoryBtn = document.getElementById('clear-history-btn');

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function appendMessage(role, content) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            
            if (role === 'assistant') {
                let text = content.replace(/<thought>([\s\S]*?)<\/thought>/g, function(match, p1) {
                    return `<details class="thought-box"><summary>展开</summary>\n\n${p1}\n\n</details>`;
                });
                let mathBlocks = [];
                text = text.replace(/(\$\$[\s\S]*?\$\$|\$[^$\n]*?\$)/g, function(match) {
                    mathBlocks.push(match); return `%%%MATH_PLACEHOLDER_${mathBlocks.length - 1}%%%`;
                });
                let html = marked.parse(text);
                html = html.replace(/%%%MATH_PLACEHOLDER_(\d+)%%%/g, function(match, i) {
                    return escapeHtml(mathBlocks[i]);
                });
                msgDiv.innerHTML = html;
                if (window.MathJax) { MathJax.typesetPromise([msgDiv]).catch(err => console.log('MathJax Error:', err)); }
            } else {
                msgDiv.innerText = content;
            }

            chatHistory.appendChild(msgDiv);
            if (role !== 'assistant') chatHistory.scrollTop = chatHistory.scrollHeight; 
        }

        // 应用权限限制
        function applyAuthLimits() {
            if (authMode === "guest") {
                contextToggle.checked = false;
                contextToggle.disabled = true;
                contextLabel.style.color = "#ccc";
                userInput.setAttribute("maxlength", "1000");
                userInput.placeholder = "访客模式：限 1000 字符，无上下文 (Enter 发送)";
                userInfoDisplay.innerText = "当前身份: 访客 (不保存历史记录)";
                clearHistoryBtn.style.display = "none";
                appendMessage('system', '已进入访客模式，对话不会被保存。');
            } else {
                contextToggle.disabled = false;
                contextLabel.style.color = "#00AABB";
                userInput.removeAttribute("maxlength");
                userInput.placeholder = "输入您的问题 (按 Shift+Enter 换行，Enter 发送)...";
                userInfoDisplay.innerText = `当前用户: ${currentUsername}`;
                clearHistoryBtn.style.display = "block";
            }
        }

        // 从云端加载历史记录
        async function loadCloudHistory() {
            if (authMode !== "admin" || !currentUsername) return;
            try {
                appendMessage('system', '正在同步历史记录...');
                const res = await fetch(`${API_URL}/history?user=${encodeURIComponent(currentUsername)}`);
                if (res.ok) {
                    const data = await res.json();
                    chatHistory.lastChild.remove(); // 移除同步提示
                    if (data && data.length > 0) {
                        messagesHistory = data;
                        messagesHistory.forEach(msg => appendMessage(msg.role, msg.content));
                        appendMessage('system', `已为您加载 ${data.length} 条历史记录。`);
                    } else {
                        appendMessage('system', '你已添加 宵希 打个招呼吧');//这是该用户名的首次对话，记录将被自动保存。
                    }
                }
            } catch (err) {
                chatHistory.lastChild.remove();
                appendMessage('system', '之前的她走丢了！');//云端历史加载失败，将开启新对话。
            }
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        // 发送对话请求
        async function fetchAIResponse() {
            const currentMessage = userInput.value.trim();
            if (!currentMessage) return;

            appendMessage('user', currentMessage);
            messagesHistory.push({ role: "user", content: currentMessage });
            userInput.value = "";
            sendBtn.disabled = true;
            appendMessage('system', 'AI 思考中...');

            try {
                const payloadMessages = (contextToggle.checked && authMode === "admin")
                    ? messagesHistory 
                    : [{ role: "user", content: currentMessage }];

                const headers = {
                    'cf-aig-authorization': `Bearer ${clientToken}`,
                    'Content-Type': 'application/json'
                };
                if (currentUsername) headers['X-Username'] = currentUsername;

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({ messages: payloadMessages })
                });

                chatHistory.lastChild.remove(); 

                if (!response.ok) {
                    const errData = await response.json().catch(()=>({}));
                    throw new Error(errData.error || `状态码: ${response.status}`);
                }

                const data = await response.json();
                const aiReply = data.choices[0].message.content;

                appendMessage('assistant', aiReply);
                messagesHistory.push({ role: "assistant", content: aiReply });

            } catch (error) {
                messagesHistory.pop(); 
                if(chatHistory.lastChild.className.includes('system')) { chatHistory.lastChild.remove(); }
                appendMessage('system', `请求失败: ${error.message}`);
                
                if (error.message.includes("密码错误") || error.message.includes("401")) {
                    authMode = ""; clientToken = ""; modalOverlay.style.display = 'flex';
                }
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function handleSend() {
            if (!userInput.value.trim()) return;
            if (!authMode) {
                modalOverlay.style.display = 'flex'; keySuffixInput.focus();
            } else { fetchAIResponse(); }
        }

        // 清空历史按钮逻辑
        clearHistoryBtn.addEventListener('click', async () => {
            if (confirm("确定要永远离开我吗")) {
                try {
                    await fetch(`${API_URL}/history?user=${encodeURIComponent(currentUsername)}`, { method: 'DELETE' });
                    messagesHistory = [];
                    chatHistory.innerHTML = "";
                    appendMessage('system', '再见了');
                } catch (e) {
                    alert("清空失败：" + e.message);
                }
            }
        });

        saveKeyBtn.addEventListener('click', async () => {
            const userVal = usernameInput.value.trim();
            const passVal = keySuffixInput.value.trim();
            if (!userVal) { alert("用户名不能为空！"); return; }
            if (passVal.length === 3) {
                authMode = "admin";
                currentUsername = userVal;
                clientToken = passVal;
                applyAuthLimits();
                modalOverlay.style.display = 'none';
                await loadCloudHistory();
            } else {
                alert("请输入准确的 3 位密码！");
            }
        });

        guestBtn.addEventListener('click', () => {
            authMode = "guest";
            clientToken = "guest"; 
            currentUsername = "";
            applyAuthLimits();
            modalOverlay.style.display = 'none';
        });

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }});
        keySuffixInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveKeyBtn.click(); });
    </script>
</body>
</html>
