<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sirius 谱面演示器 (云端增强版)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #080911; color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100vh;
        }
        #game-container {
            position: relative; width: 100%; max-width: 1100px; height: 78vh;
            background: #000; box-shadow: 0 16px 50px rgba(0, 0, 0, 0.95);
            border-radius: 14px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.12);
            display: flex; align-items: center; justify-content: center;
        }
        canvas { width: 100%; height: 100%; display: block; }
        
        #ui-overlay {
            position: absolute; top: 16px; left: 20px; pointer-events: none;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9); z-index: 10;
        }
        .song-title { font-size: 1.35rem; font-weight: 800; color: #f2346a; }
        .song-meta { font-size: 0.85rem; color: #d0d2db; margin-top: 4px; }
        
        #status-panel {
            position: absolute; top: 16px; right: 20px; display: flex;
            flex-direction: column; gap: 4px; align-items: flex-end; z-index: 10;
        }
        .tag-status {
            font-size: 0.78rem; padding: 4px 10px; border-radius: 6px;
            background: rgba(18, 22, 38, 0.85); border: 1px solid rgba(255, 255, 255, 0.15); color: #aaa;
        }
        .tag-status.active { color: #4ade80; border-color: rgba(74, 222, 128, 0.4); }

        /* 启动与设置面板 */
        #setup-mask {
            position: absolute; inset: 0; background: rgba(11, 13, 23, 0.92);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 20; transition: opacity 0.4s; padding: 20px;
        }
        #setup-mask.hide { opacity: 0; pointer-events: none; }
        .setup-box {
            background: rgba(20, 24, 40, 0.95); padding: 30px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 500px;
        }
        .setup-box h2 { margin-bottom: 20px; color: #f2346a; text-align: center; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 5px; }
        .input-group input[type="text"] {
            width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #444;
            background: #111; color: #fff; font-size: 0.9rem;
        }
        .setup-box button {
            width: 100%; padding: 12px; background: #f2346a; border: none; border-radius: 6px;
            color: #fff; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s;
        }
        .setup-box button:hover { background: #ff4785; }
        .setup-box button:disabled { background: #555; cursor: not-allowed; }
        #load-log {
            margin-top: 15px; font-size: 0.85rem; color: #4ade80; text-align: center; min-height: 20px;
        }
        .local-drop-tip { margin-top: 15px; font-size: 0.8rem; color: #888; text-align: center; }

        /* 控制面板 */
        #controls {
            width: 100%; max-width: 1100px; height: 18vh; padding: 12px 24px;
            background: rgba(18, 22, 38, 0.98); border-radius: 14px; margin-top: 8px;
            display: flex; flex-direction: column; justify-content: space-around;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .progress-bar-container { display: flex; align-items: center; gap: 12px; }
        .time-text { font-size: 0.9rem; font-family: monospace; min-width: 50px; color: #aaa; }
        input[type="range"] { flex: 1; accent-color: #f2346a; cursor: pointer; }
        .buttons-container { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .btn-group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        button.ctrl-btn, .file-btn {
            background: #2b3254; border: 1px solid rgba(255, 255, 255, 0.15); color: #fff;
            padding: 7px 14px; border-radius: 7px; cursor: pointer; font-weight: 600;
            font-size: 0.85rem; transition: all 0.2s; display: inline-flex; align-items: center;
        }
        button.ctrl-btn:hover, .file-btn:hover { background: #f2346a; border-color: #f2346a; }
        .ctrl-label {
            font-size: 0.85rem; color: #ccd; display: flex; align-items: center; gap: 6px;
            background: rgba(0, 0, 0, 0.35); padding: 5px 10px; border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="stage"></canvas>
    
    <div id="ui-overlay">
        <div class="song-title" id="disp-title">等待载入</div>
        <div class="song-meta" id="disp-meta"></div>
    </div>

    <div id="status-panel">
        <span class="tag-status" id="st-chart">谱面: 未加载</span>
        <span class="tag-status" id="st-audio">音频: 未加载</span>
        <span class="tag-status" id="st-bg">背景: 默认</span>
    </div>

    <div id="setup-mask">
        <div class="setup-box">
            <h2>☁️ 云端直接拉取</h2>
            <div class="input-group">
                <label>Sonolus 关卡链接</label>
                <input type="text" id="level-url" placeholder="例: https://wds.server.littleyang.com.cn/levels/sirius-xxx">
            </div>
            <button id="btn-fetch">解析并载入</button>
            <div id="load-log">就绪... (点击按钮一键解析)</div>
            <div class="local-drop-tip">无网环境支持：直接将本地 .json、音频、图片拖入此窗口</div>
        </div>
    </div>
</div>

<div id="controls">
    <div class="progress-bar-container">
        <span class="time-text" id="current-time">00:00</span>
        <input type="range" id="seek-bar" min="0" max="100" step="0.01" value="0">
        <span class="time-text" id="total-time">00:00</span>
    </div>
    <div class="buttons-container">
        <div class="btn-group">
            <button class="ctrl-btn" id="btn-play">▶ 播放</button>
            <button class="ctrl-btn" id="btn-restart">↺ 重播</button>
            <button class="ctrl-btn" id="btn-return">📥 重新拉取</button>
            <label class="file-btn">
                📄 选谱面
                <input type="file" id="input-chart" accept=".json,*">
            </label>
            <label class="file-btn">
                🎵 选音频
                <input type="file" id="input-audio">
            </label>
        </div>
        <div class="btn-group">
            <label class="ctrl-label">
                流速:
                <input type="range" id="speed-bar" min="1.0" max="16.0" step="0.1" value="10.0" style="width: 90px;">
                <span id="speed-val">10.0</span>
            </label>
            <label class="ctrl-label">
                音量:
                <input type="range" id="vol-bar" min="0" max="1" step="0.05" value="0.8" style="width: 60px;">
            </label>
        </div>
    </div>
</div>

<script>
// ==================== 0. 全局工具与核心变量 ====================
const PROXY_BASE = "https://wdstar.pages.dev";
const logEl = document.getElementById("load-log");

// 确保滑动条拖拽状态被安全声明
let isDraggingSeek = false; 

function formatTime(sec) {
    if (isNaN(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60).toString().padStart(2, '0');
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
}

function log(msg, error=false) {
    logEl.style.color = error ? "#ff4444" : "#4ade80";
    logEl.innerText = msg;
    console.log("[Status]:", msg);
}

// 谱面与渲染引擎变量
let bpmTimeline = [{ beat: 0, bpm: 60.0, time: 0 }];
let notes = [];
let holds = [];
let syncLines = [];
let totalDuration = 60.0;
const bgImg = new Image();

// 音频系统变量
let audioCtx = null;
let audioBuffer = null;
let audioSourceNode = null;
let gainNode = null;
let isPlaying = false;
let startTimeOffset = 0;
let playStartContextTime = 0;

// ==================== 1. Web Audio 引擎 ====================
function initAudioContext() {
    if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        gainNode = audioCtx.createGain();
        gainNode.gain.value = parseFloat(document.getElementById("vol-bar").value);
        gainNode.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function playAudio(offset) {
    initAudioContext();
    if (audioSourceNode) {
        try { audioSourceNode.stop(); } catch(e){}
        audioSourceNode.disconnect();
    }
    if (audioBuffer) {
        audioSourceNode = audioCtx.createBufferSource();
        audioSourceNode.buffer = audioBuffer;
        audioSourceNode.connect(gainNode);
        audioSourceNode.start(0, offset);
    }
    playStartContextTime = audioCtx ? audioCtx.currentTime : (performance.now() / 1000);
    startTimeOffset = offset;
}

function stopAudio() {
    if (audioSourceNode) {
        try { audioSourceNode.stop(); } catch(e){}
        audioSourceNode.disconnect();
        audioSourceNode = null;
    }
}

function getCurrentPlayTime() {
    if (!isPlaying) return startTimeOffset;
    if (audioCtx) return startTimeOffset + (audioCtx.currentTime - playStartContextTime);
    return startTimeOffset + (performance.now() - playStartContextTime * 1000) / 1000;
}

// ==================== 2. 谱面解析引擎 (支持多节长条与同步线) ====================
function parseChartJSON(jsonObj, filename) {
    if (!jsonObj || !Array.isArray(jsonObj.entities)) {
        throw new Error("无效的 Sirius chart.json 结构");
    }

    notes = []; holds = []; syncLines = []; bpmTimeline = [];

    const bpmEntities = jsonObj.entities.filter(e => e.archetype === "#BPM_CHANGE");
    bpmEntities.forEach(e => {
        let b = 0, bpm = 60;
        e.data.forEach(d => {
            if (d.name === "#BEAT") b = d.value;
            if (d.name === "#BPM") bpm = d.value;
        });
        bpmTimeline.push({ beat: b, bpm: bpm, time: 0 });
    });
    if (bpmTimeline.length === 0) bpmTimeline.push({ beat: 0, bpm: 60.0, time: 0 });
    bpmTimeline.sort((a, b) => a.beat - b.beat);

    for (let i = 0; i < bpmTimeline.length; i++) {
        if (i === 0) bpmTimeline[i].time = 0;
        else {
            const prev = bpmTimeline[i - 1];
            bpmTimeline[i].time = prev.time + ((bpmTimeline[i].beat - prev.beat) * (60.0 / prev.bpm));
        }
    }

    function beatToSeconds(beat) {
        let seg = bpmTimeline[0];
        for (let i = bpmTimeline.length - 1; i >= 0; i--) {
            if (beat >= bpmTimeline[i].beat) { seg = bpmTimeline[i]; break; }
        }
        return seg.time + (beat - seg.beat) * (60.0 / seg.bpm);
    }

    let maxTime = 0;
    const activeHoldPool = []; 

    jsonObj.entities.forEach(ent => {
        const d = {};
        if (ent.data) ent.data.forEach(item => { d[item.name] = item.value; });
        const type = ent.archetype;
        const time = beatToSeconds(d.beat || 0);
        if (time > maxTime) maxTime = time;

        let noteType = "normal";
        if (type.includes("Critical")) noteType = "critical";
        if (type.includes("Scratch")) noteType = "scratch";
        if (type.includes("Flick")) noteType = "flick";

        if (type === "Sirius Sync Line") {
            syncLines.push({ time: time, left: d.left, right: d.right });
        }
        else if (type.includes("Hold Start") || type.includes("Scratch Hold Start")) {
            activeHoldPool.push({ beat: d.beat, time: time, lane: d.lane, laneLength: d.laneLength, type: noteType });
            notes.push({ time, lane: d.lane, laneLength: d.laneLength, type: noteType });
        }
        else if (type.includes("Hold End") || type.includes("Scratch Hold End")) {
            const stBeat = d.stBeat;
            let head = null;
            if (stBeat !== undefined) {
                head = activeHoldPool.find(h => Math.abs(h.beat - stBeat) < 0.001 && h.lane === d.lane) || activeHoldPool.find(h => Math.abs(h.beat - stBeat) < 0.001);
            }

            if (head) {
                holds.push({
                    stTime: head.time, endTime: time,
                    lane: d.lane, laneLength: d.laneLength,
                    type: head.type === "critical" ? "critical" : (type.includes("Scratch") ? "scratch" : "normal")
                });
            }

            if (d.scratchLength !== undefined && d.scratchLength !== 0) {
                const sLen = d.scratchLength;
                let flickLane = d.lane;
                let flickLength = Math.max(d.laneLength, Math.abs(sLen));
                if (sLen < 0) flickLane = Math.max(1, d.lane + d.laneLength + sLen);
                notes.push({ time, lane: flickLane, laneLength: flickLength, type: "flick" });
            } else {
                notes.push({ time, lane: d.lane, laneLength: d.laneLength, type: head ? head.type : "normal" });
            }

            activeHoldPool.push({ beat: d.beat, time: time, lane: d.lane, laneLength: d.laneLength, type: head ? head.type : noteType });
        }
        else if (type.includes("Note") || type.includes("Flick")) {
            notes.push({ time, lane: d.lane, laneLength: d.laneLength, type: noteType });
        }
    });

    totalDuration = Math.max(maxTime + 3.0, 30.0);
    document.getElementById("st-chart").innerText = `谱面: ${notes.length + holds.length} 实体`;
    document.getElementById("st-chart").classList.add("active");
    
    if (!document.getElementById("disp-title").innerText || document.getElementById("disp-title").innerText === "等待载入") {
        document.getElementById("disp-title").innerText = filename || "已载入谱面";
    }
}

function parseMetadataJSON(meta) {
    if (meta.item) meta = meta.item;
    if (meta.title) document.getElementById("disp-title").innerText = meta.title;
    
    let sub = [];
    if (meta.artists) sub.push("Artist: " + meta.artists);
    if (meta.rating) sub.push("Lv." + meta.rating);
    if (meta.tags && meta.tags[0]) sub.push(meta.tags[0].title);
    if (sub.length > 0) document.getElementById("disp-meta").innerText = sub.join(" | ");
}

// ==================== 3. 云端代理拉取与脱壳引擎 ====================
async function decompressIfNeeded(buffer) {
    const view = new Uint8Array(buffer);
    if (view[0] === 0x1F && view[1] === 0x8B) {
        log("检测到 GZip 压缩，正在解压...");
        try {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            writer.write(buffer);
            writer.close();
            const response = new Response(ds.readable);
            return await response.text();
        } catch (e) {
            throw new Error("GZip 解压失败，您的浏览器可能不支持原生解压");
        }
    }
    return new TextDecoder().decode(buffer);
}

document.getElementById("btn-fetch").addEventListener("click", async () => {
    console.log("[DEBUG] Fetch button triggered.");
    
    let levelUrl = document.getElementById("level-url").value.trim();
    if (!levelUrl) { 
        log("请填写关卡链接！", true); 
        return; 
    }
    
    let apiUrl = levelUrl;
    if (!apiUrl.includes("/sonolus/")) {
        try {
            const urlObj = new URL(levelUrl);
            apiUrl = `${urlObj.origin}/sonolus${urlObj.pathname}`;
        } catch(e) {
            log("非法的 URL 格式", true); 
            return;
        }
    }

    try {
        initAudioContext();
        document.getElementById("btn-fetch").disabled = true;
        document.getElementById("btn-fetch").innerText = "解析中...";
        log("1/4 正在通过代理拉取元数据...");
        
        const fetchUrl = `${PROXY_BASE}?url=${encodeURIComponent(apiUrl)}`;
        console.log("[DEBUG] Proxy Request URL:", fetchUrl);
        
        const metaRes = await fetch(fetchUrl);
        if (!metaRes.ok) throw new Error(`HTTP ${metaRes.status}`);
        const metaJson = await metaRes.json();
        
        const item = metaJson.item;
        if (!item) throw new Error("代理服务器没有返回有效的关卡信息");
        
        parseMetadataJSON(item);
        
        const dataUrl = item.data?.url;
        const bgmUrl = item.bgm?.url;
        let bgUrl = null;
        if (item.useBackground?.item?.image?.url) bgUrl = item.useBackground.item.image.url;
        else if (item.engine?.background?.image?.url) bgUrl = item.engine.background.image.url;
        else if (item.cover?.url) bgUrl = item.cover.url;

        if (!dataUrl) throw new Error("该关卡没有提供谱面数据文件");

        log("2/4 正在并发下载 谱面/音频/背景...");
        const fetchTasks = [
            fetch(`${PROXY_BASE}?url=${encodeURIComponent(dataUrl)}`).then(r => r.arrayBuffer()),
            bgmUrl ? fetch(`${PROXY_BASE}?url=${encodeURIComponent(bgmUrl)}`).then(r => r.arrayBuffer()) : Promise.resolve(null),
            bgUrl ? fetch(`${PROXY_BASE}?url=${encodeURIComponent(bgUrl)}`).then(r => r.blob()) : Promise.resolve(null)
        ];

        const [chartBuf, bgmBuf, bgBlob] = await Promise.all(fetchTasks);

        log("3/4 正在构建谱面物理追踪树...");
        const chartStr = await decompressIfNeeded(chartBuf);
        parseChartJSON(JSON.parse(chartStr), item.title || "未知曲目");

        if (bgBlob) { 
            bgImg.src = URL.createObjectURL(bgBlob); 
            document.getElementById("st-bg").innerText = "背景: 已加载";
            document.getElementById("st-bg").classList.add("active");
        }

        if (bgmBuf) {
            log("4/4 正在转码高保真音频流 (可能耗时数秒)...");
            audioBuffer = await audioCtx.decodeAudioData(bgmBuf);
            totalDuration = audioBuffer.duration;
            document.getElementById("total-time").innerText = formatTime(totalDuration);
            document.getElementById("st-audio").innerText = "音频: 已解码";
            document.getElementById("st-audio").classList.add("active");
        }

        log("✅ 所有依赖加载完毕！");
        setTimeout(() => { 
            document.getElementById("setup-mask").classList.add("hide"); 
            document.getElementById("btn-fetch").innerText = "解析并载入";
        }, 600);

    } catch (e) {
        log(`网络请求异常: ${e.message}`, true);
        console.error(e);
        document.getElementById("btn-fetch").innerText = "解析失败，请重试";
    } finally {
        document.getElementById("btn-fetch").disabled = false;
    }
});

// 本地文件兼容处理
function handleUniversalFile(file) {
    if (file.name.endsWith(".json")) {
        const reader = new FileReader();
        reader.onload = e => {
            try {
                const obj = JSON.parse(e.target.result);
                if (obj.entities) {
                    parseChartJSON(obj, file.name);
                    document.getElementById("setup-mask").classList.add("hide");
                } else parseMetadataJSON(obj);
            } catch(e) {}
        };
        reader.readAsText(file);
    } else if (file.type.startsWith("image/") || /\.(png|jpe?g|webp|bmp)$/i.test(file.name)) {
        const reader = new FileReader();
        reader.onload = e => {
            bgImg.src = e.target.result;
            document.getElementById("st-bg").innerText = "背景: 本地";
            document.getElementById("st-bg").classList.add("active");
        }
        reader.readAsDataURL(file);
    } else {
        initAudioContext();
        const reader = new FileReader();
        reader.onload = e => {
            audioCtx.decodeAudioData(e.target.result).then(buf => {
                audioBuffer = buf;
                totalDuration = buf.duration;
                document.getElementById("total-time").innerText = formatTime(totalDuration);
                document.getElementById("st-audio").innerText = "音频: 本地";
                document.getElementById("st-audio").classList.add("active");
            });
        };
        reader.readAsArrayBuffer(file);
    }
}

window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => {
    e.preventDefault();
    Array.from(e.dataTransfer.files).forEach(handleUniversalFile);
});

document.getElementById("input-chart").addEventListener("change", e => { if(e.target.files[0]) handleUniversalFile(e.target.files[0]); });
document.getElementById("input-audio").addEventListener("change", e => { if(e.target.files[0]) handleUniversalFile(e.target.files[0]); });

// ==================== 4. 视觉投影与渲染管线 ====================
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
let hiSpeed = 10.0;
const accelPower = 2.0;

let viewport = { centerX: 0, topY: 0, botY: 0, topWidth: 0, botWidth: 0 };

function resize() {
    canvas.width = canvas.parentElement.clientWidth * window.devicePixelRatio;
    canvas.height = canvas.parentElement.clientHeight * window.devicePixelRatio;
    const w = canvas.width, h = canvas.height;
    
    let botW = w * 0.86;
    let trackH = botW * 0.75;
    if (trackH > h * 0.82) { trackH = h * 0.82; botW = trackH / 0.75; }
    
    viewport = {
        centerX: w * 0.5, topY: (h + trackH) / 2 - trackH, botY: (h + trackH) / 2,
        topWidth: botW / 6.0, botWidth: botW
    };
}
window.addEventListener("resize", resize);
resize();

function project(lane, length, visualP) {
    const curY = viewport.topY + (viewport.botY - viewport.topY) * visualP;
    const curWidth = viewport.topWidth + (viewport.botWidth - viewport.topWidth) * visualP;
    const laneUnit = curWidth / 12;
    const x1 = viewport.centerX - (curWidth / 2) + (lane - 1) * laneUnit;
    return { x1, x2: x1 + length * laneUnit, y: curY, w: length * laneUnit };
}

function drawStage() {
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = "#080911";
    ctx.fillRect(0, 0, w, h);
    if (bgImg.complete && bgImg.naturalWidth > 0) {
        ctx.globalAlpha = 0.35; ctx.drawImage(bgImg, 0, 0, w, h); ctx.globalAlpha = 1.0;
    }
    ctx.save();
    for (let i = 0; i <= 12; i++) {
        const pTop = project(i + 1, 0, 0), pBot = project(i + 1, 0, 1);
        ctx.strokeStyle = (i === 0 || i === 12) ? "rgba(255,255,255,0.75)" : "rgba(255,255,255,0.12)";
        ctx.lineWidth = (i === 0 || i === 12) ? 3 : 1;
        ctx.beginPath(); ctx.moveTo(pTop.x1, pTop.y); ctx.lineTo(pBot.x1, pBot.y); ctx.stroke();
    }
    const botP1 = project(1, 0, 1), botP2 = project(13, 0, 1);
    ctx.strokeStyle = "#f2346a"; ctx.lineWidth = 5; ctx.shadowColor = "#f2346a"; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.moveTo(botP1.x1, botP1.y); ctx.lineTo(botP2.x1, botP2.y); ctx.stroke();
    ctx.restore();
}

function renderChart(currentTime) {
    const timeSpan = 5.0 / (hiSpeed * 1.2);

    // 1. 同步连线 (Sync Line)
    syncLines.forEach(sync => {
        const timeDiff = sync.time - currentTime;
        if (timeDiff >= 0 && timeDiff <= timeSpan) {
            const visualProgress = Math.pow(1.0 - (timeDiff / timeSpan), accelPower);
            const pos1 = project(sync.left, 0, visualProgress);
            const pos2 = project(sync.right + 1, 0, visualProgress);
            ctx.save();
            ctx.strokeStyle = "rgba(255, 255, 255, 0.85)"; ctx.lineWidth = 4;
            ctx.shadowColor = "rgba(255, 255, 255, 0.8)"; ctx.shadowBlur = 8;
            ctx.beginPath(); ctx.moveTo(pos1.x1, pos1.y); ctx.lineTo(pos2.x1, pos2.y); ctx.stroke();
            ctx.restore();
        }
    });

    // 2. 长条面 (Hold Bodies)
    holds.forEach(hold => {
        if (currentTime < hold.endTime && hold.stTime < currentTime + timeSpan) {
            const steps = 14;
            const tStartClamped = Math.max(hold.stTime, currentTime);
            const tEndClamped = Math.min(hold.endTime, currentTime + timeSpan);
            const leftPoints = [], rightPoints = [];

            for (let i = 0; i <= steps; i++) {
                const curT = tStartClamped + (tEndClamped - tStartClamped) * (i / steps);
                const visualP = Math.pow(1.0 - (curT - currentTime) / timeSpan, accelPower);
                const pos = project(hold.lane, hold.laneLength, visualP);
                leftPoints.push({ x: pos.x1, y: pos.y }); rightPoints.push({ x: pos.x2, y: pos.y });
            }

            if (leftPoints.length > 1) {
                ctx.save();
                let fillGrad = ctx.createLinearGradient(0, rightPoints[rightPoints.length - 1].y, 0, leftPoints[0].y);
                if (hold.type === "scratch") {
                    fillGrad.addColorStop(0, "rgba(119, 62, 184, 0.45)");
                    fillGrad.addColorStop(1, "rgba(119, 62, 184, 0.85)");
                } else if (hold.type === "critical") {
                    fillGrad.addColorStop(0, "rgba(255, 208, 0, 0.35)");
                    fillGrad.addColorStop(1, "rgba(255, 208, 0, 0.75)");
                } else {
                    fillGrad.addColorStop(0, "rgba(0, 195, 255, 0.4)"); 
                    fillGrad.addColorStop(1, "rgba(0, 140, 255, 0.85)");
                }
                ctx.fillStyle = fillGrad; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3.5;
                ctx.shadowColor = "rgba(255, 255, 255, 0.8)"; ctx.shadowBlur = 4;
                ctx.beginPath(); ctx.moveTo(leftPoints[0].x, leftPoints[0].y);
                for (let i = 1; i < leftPoints.length; i++) ctx.lineTo(leftPoints[i].x, leftPoints[i].y);
                for (let i = rightPoints.length - 1; i >= 0; i--) ctx.lineTo(rightPoints[i].x, rightPoints[i].y);
                ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
            }
        }
    });

    // 3. 点音符与节点 (Notes & Flick)
    notes.forEach(note => {
        const timeDiff = note.time - currentTime;
        if (timeDiff >= 0 && timeDiff <= timeSpan) {
            const visualProgress = Math.pow(1.0 - (timeDiff / timeSpan), accelPower);
            const pos = project(note.lane, note.laneLength, visualProgress);
            const noteHeight = 36 * (0.6 + visualProgress * 0.7); // 3倍厚度加强

            ctx.save();
            let color = "#f2346a"; // 粉红
            if (note.type === "critical") color = "#ffd000"; // 金黄
            if (note.type === "flick") color = "#b53cf5"; // 深紫
            if (note.type === "scratch") color = "#773eb8"; // 紫罗兰

            ctx.shadowColor = color; ctx.shadowBlur = 10; ctx.fillStyle = color;
            ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3.0;

            ctx.beginPath(); ctx.roundRect(pos.x1, pos.y - noteHeight / 2, pos.w, noteHeight, 6);
            ctx.fill(); ctx.stroke();

            // 滑键专属六重连击书名号
            if (note.type === "flick") {
                const fontSize = Math.max(14, Math.min(28, pos.w * 0.28));
                ctx.font = `900 ${fontSize}px sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
                ctx.fillStyle = "#faf3ff"; ctx.shadowColor = "#d8b4fe"; ctx.shadowBlur = 12;
                ctx.fillText("《《《  》》》", pos.x1 + pos.w * 0.5, pos.y - noteHeight / 2 - 3);
            }
            ctx.restore();
        }
    });
}

// 核心渲染循环
function update() {
    let curTime = getCurrentPlayTime();
    if (isPlaying && curTime > totalDuration) {
        isPlaying = false; stopAudio(); startTimeOffset = 0; document.getElementById("btn-play").innerText = "▶ 播放";
    }
    
    drawStage();
    renderChart(curTime);
    
    document.getElementById("current-time").innerText = formatTime(curTime);
    if (!isDraggingSeek) {
        document.getElementById("seek-bar").value = (curTime / totalDuration) * 100;
    }
    requestAnimationFrame(update);
}

// ==================== 5. UI 事件控制器 ====================
document.getElementById("btn-play").addEventListener("click", (e) => {
    initAudioContext();
    if (isPlaying) {
        startTimeOffset = getCurrentPlayTime(); stopAudio();
        isPlaying = false; e.target.innerText = "▶ 播放";
    } else {
        isPlaying = true; playAudio(startTimeOffset);
        e.target.innerText = "❚❚ 暂停";
    }
});

document.getElementById("btn-restart").addEventListener("click", () => {
    stopAudio(); startTimeOffset = 0;
    if (isPlaying) playAudio(0); else document.getElementById("btn-play").innerText = "▶ 播放";
});

document.getElementById("btn-return").addEventListener("click", () => {
    stopAudio(); isPlaying = false; document.getElementById("btn-play").innerText = "▶ 播放";
    document.getElementById("setup-mask").classList.remove("hide");
});

const seekBar = document.getElementById("seek-bar");
seekBar.addEventListener("input", () => {
    isDraggingSeek = true;
    const targetTime = (seekBar.value / 100) * totalDuration;
    if (isPlaying) playAudio(targetTime); else startTimeOffset = targetTime;
});
seekBar.addEventListener("change", () => { isDraggingSeek = false; });

document.getElementById("speed-bar").addEventListener("input", (e) => {
    hiSpeed = parseFloat(e.target.value);
    document.getElementById("speed-val").innerText = hiSpeed.toFixed(1);
});

document.getElementById("vol-bar").addEventListener("input", (e) => {
    if (gainNode) gainNode.gain.value = parseFloat(e.target.value);
});

// 启动渲染循环
requestAnimationFrame(update);
</script>
</body>
</html>
