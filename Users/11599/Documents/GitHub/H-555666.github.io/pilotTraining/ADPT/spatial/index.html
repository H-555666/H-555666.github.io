<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spatial Orientation — ADPT</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
body{font-size:62.5%;font-family:"Microsoft YaHei",Arial;background:#080810;color:#ccc;margin:0;padding:0;overflow-x:hidden;user-select:none;-webkit-user-select:none;}
#wrap{max-width:800px;margin:0 auto;padding:10px;}
h1{font-size:1.3rem;color:#88ccff;text-align:center;margin:6px 0;}
#screen-intro,#screen-play,#screen-result{display:none;}
#screen-intro.active,#screen-play.active,#screen-result.active{display:block;}
.intro-text{font-size:0.82rem;color:#8899aa;line-height:1.6;margin:12px 0;text-align:center;}
.btn{display:block;width:100%;max-width:300px;margin:16px auto;padding:12px;border-radius:8px;font-size:1rem;text-align:center;cursor:pointer;border:none;color:#dde;box-sizing:border-box;}
.btn-start{background:linear-gradient(135deg,#1a5a3c,#2a8a5c);}
.btn-back{background:#1a1a2e;border:1px solid #334;color:#667;font-size:0.82rem;padding:8px;max-width:300px;text-decoration:none;}
.btn-back:hover{color:#99a;}
#timer-bar{width:100%;height:4px;background:#1a1a2e;border-radius:2px;margin:6px 0;overflow:hidden;}
#timer-fill{height:100%;background:linear-gradient(90deg,#2a8a5c,#88cc44);width:100%;transition:width 0.3s;}
.canvas-wrap{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px;}
.canvas-wrap canvas{border:1px solid #1a1a2e;border-radius:4px;background:#0a0a14;}
#instruments-canvas{width:45%;min-width:200px;height:auto;aspect-ratio:3/4;}
#options-canvas{width:50%;min-width:240px;height:auto;aspect-ratio:1/1;}
.question-counter{text-align:center;font-size:0.78rem;color:#556;margin:4px 0;}
.result-summary{text-align:center;font-size:0.9rem;color:#aac;line-height:2;}
.result-summary .big{font-size:1.8rem;color:#88ccff;font-weight:bold;}
</style>
</head>
<body>
<div id="wrap">
<h1>Spatial Orientation &amp; Instrument Reading</h1>
<div id="screen-intro" class="active">
<p class="intro-text">The left panel shows an <strong>Attitude Indicator</strong> (pitch &amp; bank) and a <strong>Heading Indicator</strong> (compass). Click the aircraft on the right whose 3D orientation matches both instruments.<br>15 questions. <strong>8 seconds each.</strong></p>
<button class="btn btn-start" onclick="startTest()">Start Test</button>
<a class="btn btn-back" href="../" style="display:block;text-decoration:none;">Back to ADPT</a>
</div>
<div id="screen-play">
<div id="timer-bar"><div id="timer-fill"></div></div>
<div class="question-counter" id="q-counter"></div>
<div class="canvas-wrap">
<canvas id="instruments-canvas" width="280" height="380"></canvas>
<canvas id="options-canvas" width="360" height="360"></canvas>
</div>
</div>
<div id="screen-result">
<div class="result-summary" id="result-text"></div>
<button class="btn btn-start" onclick="startTest()">Retry</button>
<a class="btn btn-back" href="../" style="display:block;text-decoration:none;">Back to ADPT</a>
</div>
</div>

<script>
var TOTAL_QUESTIONS=15;
var QUESTION_TIME=8000;
var currentQ=0,correctAns=0,answered=false;
var qPitch=0,qBank=0,qHeading=0;
var testStart=0,testRunning=false,qDeadline=0,animId=null;

function showScreen(id){
    ['screen-intro','screen-play','screen-result'].forEach(function(s){
        document.getElementById(s).classList.remove('active');
    });
    document.getElementById(id).classList.add('active');
}

function drawInstruments(){
    var c=document.getElementById('instruments-canvas');
    var ctx=c.getContext('2d');
    var w=c.width,h=c.height;
    ctx.clearRect(0,0,w,h);

    // Attitude Indicator
    var ax=w/2,ay=130,ar=95;
    // sky/ground
    ctx.save();
    ctx.beginPath();ctx.arc(ax,ay,ar,0,Math.PI*2);ctx.clip();
    // sky
    var skyGrad=ctx.createLinearGradient(0,ay-ar,0,ay+ar);
    skyGrad.addColorStop(0,'#2299dd');skyGrad.addColorStop(0.48,'#44aadd');skyGrad.addColorStop(0.52,'#8B6914');skyGrad.addColorStop(1,'#6B4914');
    ctx.fillStyle=skyGrad;
    ctx.fillRect(ax-ar,ay-ar,ar*2,ar*2);

    // rotated horizon
    ctx.save();
    ctx.translate(ax,ay);
    ctx.rotate(qBank);
    ctx.translate(0,qPitch/45*ar);
    ctx.strokeStyle='#fff';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(-ar*1.2,0);ctx.lineTo(ar*1.2,0);ctx.stroke();
    // pitch lines
    for(var p=-40;p<=40;p+=10){
        if(p===0)continue;
        var y=p/45*ar;
        var len=p%20===0?40:20;
        ctx.strokeStyle='#fff';ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(-len,y);ctx.lineTo(len,y);ctx.stroke();
        if(p%20===0){
            ctx.fillStyle='#fff';ctx.font='9px Arial';ctx.textAlign='center';
            ctx.fillText(Math.abs(p),-len-14,y+3);ctx.fillText(Math.abs(p),len+14,y+3);
        }
    }
    // aircraft symbol
    ctx.strokeStyle='#ffcc00';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(-28,0);ctx.lineTo(28,0);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-8,-6);ctx.lineTo(0,0);ctx.lineTo(8,-6);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,14);ctx.stroke();
    ctx.restore();
    ctx.restore();

    // bezel
    ctx.strokeStyle='#445';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(ax,ay,ar,0,Math.PI*2);ctx.stroke();
    // bank markers
    for(var i=0;i<360;i+=15){
        var rad=i*Math.PI/180;
        var inner=i%90===0?ar-12:i%45===0?ar-10:ar-7;
        if(i===0)ctx.fillStyle='#ffcc00';
        else ctx.fillStyle='#889';
        ctx.beginPath();ctx.arc(ax+Math.cos(rad-Math.PI/2)*(ar-18),ay+Math.sin(rad-Math.PI/2)*(ar-18),2,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(ax,ay-ar+18,6,0,Math.PI);ctx.fill();

    // Heading Indicator (compass) below
    var hx=w/2,hy=290,hr=70;
    ctx.fillStyle='#0a0a18';ctx.strokeStyle='#334';
    ctx.beginPath();ctx.arc(hx,hy,hr,0,Math.PI*2);ctx.fill();ctx.stroke();
    // draw heading arc
    ctx.save();
    ctx.beginPath();ctx.arc(hx,hy,hr,0,Math.PI*2);ctx.clip();
    ctx.strokeStyle='#556';ctx.lineWidth=1;
    for(var dg=0;dg<360;dg+=10){
        var rad=(dg-qHeading)*Math.PI/180;
        var x=hx+Math.sin(rad)*(hr-6),y=hy-Math.cos(rad)*(hr-6);
        var x2=hx+Math.sin(rad)*(hr-16),y2=hy-Math.cos(rad)*(hr-16);
        if(dg%90===0){
            ctx.strokeStyle='#ffcc00';ctx.lineWidth=2;
            ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke();
            var labels={'0':'N','90':'E','180':'S','270':'W'};
            ctx.fillStyle='#ffcc00';ctx.font='bold 12px Arial';ctx.textAlign='center';
            ctx.fillText(labels[dg]||'',hx+Math.sin(rad)*(hr-24),hy-Math.cos(rad)*(hr-24)+4);
        }else if(dg%30===0){
            ctx.strokeStyle='#889';ctx.lineWidth=1.5;
            ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke();
        }
    }
    ctx.restore();
    // heading pointer
    ctx.fillStyle='#ff4444';
    ctx.beginPath();ctx.moveTo(hx,hy-hr+4);ctx.lineTo(hx-6,hy-hr+16);ctx.lineTo(hx+6,hy-hr+16);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#334';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(hx,hy,hr,0,Math.PI*2);ctx.stroke();

    // labels
    ctx.fillStyle='#668';ctx.font='10px "Microsoft YaHei",Arial';ctx.textAlign='center';
    ctx.fillText('ATTITUDE',w/2,25);
    ctx.fillText('HEADING',w/2,250);
    ctx.fillText('Current heading: '+qHeading+'\u00b0',w/2,hy+hr+18);
}

function drawAircraft(ctx,x,y,s,pitch,bank,color){
    // Draw a stylized 3D aircraft at (x,y) with given pitch and bank
    // Project simple 3D points with isometric-ish projection
    var scale=s||1;
    var cp=Math.cos(pitch),sp=Math.sin(pitch);
    var cb=Math.cos(bank),sb=Math.sin(bank);

    // Define fuselage points in 3D (aircraft-aligned coords: z=forward, x=right, y=up)
    var fuselage=[
        [0,-3,30],[0,3,30],[0,4,-25],[0,-4,-25] // top/bottom
    ];
    var wings=[[-28,0,3],[28,0,3],[-10,0,-8],[10,0,-8]];
    var tailH=[[-10,0,-22],[10,0,-22],[0,0,-28]];
    var tailV=[[0,-10,-22],[0,0,-22],[0,0,-28]];

    function project(p){
        // rotate by pitch around X axis, then bank around Z axis
        var y1=p[1]*cp-p[2]*sp;
        var z1=p[1]*sp+p[2]*cp;
        var x1=p[0]*cb-y1*sb;
        y1=p[0]*sb+y1*cb;
        // isometric projection: screenX = x1 + z1*0.5, screenY = -(y1) + z1*0.3
        return [x+x1*scale+z1*0.4*scale, y-y1*scale+z1*0.3*scale];
    }

    function drawPoly(pts,fill,stroke){
        if(pts.length<3)return;
        ctx.beginPath();
        var p0=project(pts[0]);
        ctx.moveTo(p0[0],p0[1]);
        for(var i=1;i<pts.length;i++){var pi=project(pts[i]);ctx.lineTo(pi[0],pi[1]);}
        ctx.closePath();
        if(fill){ctx.fillStyle=fill;ctx.fill();}
        if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}
    }

    // fuselage
    ctx.strokeStyle=color;ctx.lineWidth=2;
    ctx.beginPath();
    for(var i=0;i<fuselage.length;i++){var pi=project(fuselage[i]);if(i===0)ctx.moveTo(pi[0],pi[1]);else ctx.lineTo(pi[0],pi[1]);}
    ctx.closePath();ctx.stroke();
    ctx.fillStyle=color.replace(')','').replace('rgb(','rgba(')+',0.25)';
    ctx.fill();

    if(pitch<=0){
        // Wings
        drawPoly(wings,color.replace(')','').replace('rgb(','rgba(')+',0.3)',color);
        drawPoly(tailH,color.replace(')','').replace('rgb(','rgba(')+',0.3)',color);
        drawPoly(tailV,color.replace(')','').replace('rgb(','rgba(')+',0.3)',color);
    }else{
        drawPoly(tailV,color.replace(')','').replace('rgb(','rgba(')+',0.3)',color);
        drawPoly(tailH,color.replace(')','').replace('rgb(','rgba(')+',0.3)',color);
        drawPoly(wings,color.replace(')','').replace('rgb(','rgba(')+',0.3)',color);
    }

    // nose dot
    var nose=project([0,0,32]);
    ctx.fillStyle=color;ctx.beginPath();ctx.arc(nose[0],nose[1],3,0,Math.PI*2);ctx.fill();
}

function drawOptions(){
    var c=document.getElementById('options-canvas');
    var ctx=c.getContext('2d');
    var w=c.width,h=c.height;
    ctx.clearRect(0,0,w,h);

    // 4 slots
    var slots=[
        {x:w*0.25,y:h*0.25},{x:w*0.75,y:h*0.25},
        {x:w*0.25,y:h*0.75},{x:w*0.75,y:h*0.75}
    ];

    // Generate distractors
    var distractors=[];
    var angles=[];
    angles.push({pitch:qPitch,bank:qBank,isCorrect:true});
    while(angles.length<4){
        var p=(Math.random()-0.5)*Math.PI*0.55;
        var b=(Math.random()-0.5)*Math.PI*0.9;
        var dup=false;
        for(var j=0;j<angles.length;j++){
            if(Math.abs(angles[j].pitch-p)<0.15&&Math.abs(angles[j].bank-b)<0.15){dup=true;break;}
        }
        if(!dup)angles.push({pitch:p,bank:b,isCorrect:false});
    }
    // shuffle
    for(var i=angles.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=angles[i];angles[i]=angles[j];angles[j]=tmp;}

    slots.forEach(function(slot,idx){
        var ang=angles[idx];
        var color=ang.isCorrect?'rgb(136,204,255)':'rgb(136,170,200)';
        drawAircraft(ctx,slot.x,slot.y,0.9,ang.pitch,ang.bank,color);
        ctx.strokeStyle='#1a1a2e';ctx.lineWidth=1;
        ctx.strokeRect(slot.x-40,slot.y-35,80,70);

        // label
        ctx.fillStyle='#445';ctx.font='bold 12px Arial';ctx.textAlign='center';
        ctx.fillText(String.fromCharCode(65+idx),slot.x,slot.y+44);
    });

    // store for click
    window._options=angles;
}

function handleOptionClick(e){
    if(!testRunning||answered)return;
    var c=document.getElementById('options-canvas');
    var rect=c.getBoundingClientRect();
    var mx=(e.clientX-rect.left)/rect.width*c.width;
    var my=(e.clientY-rect.top)/rect.height*c.height;
    var w=c.width,h=c.height;
    var slots=[
        {x:w*0.25,y:h*0.25},{x:w*0.75,y:h*0.25},
        {x:w*0.25,y:h*0.75},{x:w*0.75,y:h*0.75}
    ];
    for(var i=0;i<slots.length;i++){
        var s=slots[i];
        if(Math.abs(mx-s.x)<40&&Math.abs(my-s.y)<35){
            answer(i);
            return;
        }
    }
}

function answer(idx){
    if(answered)return;
    answered=true;
    if(window._options&&window._options[idx]&&window._options[idx].isCorrect)correctAns++;
    setTimeout(nextQuestion,800);
}

function nextQuestion(){
    if(currentQ>=TOTAL_QUESTIONS){endTest();return;}
    currentQ++;
    answered=false;
    qPitch=(Math.random()-0.5)*Math.PI*0.5;
    qBank=(Math.random()-0.5)*Math.PI*0.8;
    qHeading=Math.floor(Math.random()*360);
    qDeadline=performance.now()+QUESTION_TIME;
    document.getElementById('q-counter').textContent='Question '+currentQ+' / '+TOTAL_QUESTIONS;
    drawInstruments();
    drawOptions();
}

function startTest(){
    currentQ=0;correctAns=0;answered=false;
    testStart=performance.now();testRunning=true;
    showScreen('screen-play');
    nextQuestion();
    if(animId)cancelAnimationFrame(animId);
    animId=requestAnimationFrame(timerLoop);
}

function timerLoop(now){
    if(!testRunning)return;
    animId=requestAnimationFrame(timerLoop);
    var rem=Math.max(0,qDeadline-now);
    var pct=(rem/QUESTION_TIME*100).toFixed(1);
    document.getElementById('timer-fill').style.width=pct+'%';
    if(rem<=0&&!answered){
        answered=true;
        setTimeout(nextQuestion,500);
    }
}

function endTest(){
    testRunning=false;
    if(animId)cancelAnimationFrame(animId);
    var pct=Math.round(correctAns/TOTAL_QUESTIONS*100);
    var html='<div class="big">Score: '+pct+'%</div>';
    html+=correctAns+' / '+TOTAL_QUESTIONS+' correct';
    document.getElementById('result-text').innerHTML=html;
    showScreen('screen-result');
    var raw=localStorage.getItem('adpt_spatial');
    var arr=raw?JSON.parse(raw):[];
    arr.unshift({score:pct,ts:Date.now()});
    if(arr.length>20)arr=arr.slice(0,20);
    localStorage.setItem('adpt_spatial',JSON.stringify(arr));
}

document.getElementById('options-canvas').addEventListener('click',handleOptionClick);
showScreen('screen-intro');
</script>
</body>
</html>
