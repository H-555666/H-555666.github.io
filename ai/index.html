<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Gateway</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root{--primary-color:#00AABB;--bg-color:#f4f4f9;--chat-bg:#ffffff;}
        body{font-family:sans-serif;margin:0;padding:0;background:var(--bg-color);display:flex;justify-content:center;align-items:center;height:100vh;}
        #chat-container{width:100%;max-width:800px;height:90vh;background:var(--chat-bg);border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.1);display:flex;flex-direction:column;overflow:hidden;}
        #chat-history{flex:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:15px;}
        .message{max-width:80%;padding:12px 16px;border-radius:8px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;}
        .message.user{align-self:flex-end;background:var(--primary-color);color:white;border-bottom-right-radius:0;}
        .message.assistant{align-self:flex-start;background:#e9ecef;color:#333;border-bottom-left-radius:0;}
        .message.system{align-self:center;background:transparent;color:#55DDEE;font-size:0.9em;}
        #input-area{display:flex;padding:15px;background:#fff;border-top:1px solid #ddd;gap:10px;}
        #user-input{flex:1;padding:12px;border:1px solid #ccc;border-radius:8px;resize:none;outline:none;}
        #user-input:focus{border-color:var(--primary-color);}
        button{padding:0 20px;background:var(--primary-color);color:white;border:none;border-radius:8px;cursor:pointer;}
        button:hover{background:#00AABB;}
        button:disabled{background:#ccc;cursor:not-allowed;}
        #modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;justify-content:center;align-items:center;z-index:1000;display:none;}
        #modal-content{background:white;padding:30px;border-radius:12px;width:300px;text-align:center;}
        #modal-content input{width:80%;padding:10px;margin:15px 0;border:1px solid #ccc;border-radius:6px;text-align:center;letter-spacing:5px;font-size:1.2em;}
        .thought-box {
            margin-bottom: 10px;
            padding: 8px 12px;
            background: #f8f9fa;
            border-left: 4px solid #55DDEE;
            border-radius: 4px;
            font-size: 0.9em;
            color: #555;
        }
        .thought-box summary {
            cursor: pointer;
            font-weight: bold;
            color: #55DDEE;
            user-select: none;
        }
        /* Markdown 基础样式修正 */
        .message p { margin: 0 0 10px 0; }
        .message p:last-child { margin: 0; }
        .message pre { background: #2b2b2b; color: #fff; padding: 10px; border-radius: 6px; overflow-x: auto; }
        .message code { background: rgba(0,0,0,0.1); padding: 2px 4px; border-radius: 3px; font-family: monospace; }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="chat-history">
            <div class="message system">AI助手已准备就绪。首次提问需验证3位密码。</div>
        </div>
        <div id="input-area">
            <textarea id="user-input" rows="2" placeholder="输入您的问题 (Enter 发送)..."></textarea>
            <button id="send-btn">发送</button>
        </div>
    </div>

    <div id="modal-overlay">
        <div id="modal-content">
            <h3>安全验证</h3>
            <p style="font-size: 0.9em; color: #555;">请输入 3 位密码</p>
            <!-- 限制只能输入3位 -->
            <input type="password" id="key-suffix" maxlength="3" placeholder="***" autocomplete="off" />
            <br>
            <button id="save-key-btn">确认</button>
        </div>
    </div>

    <script>
        // ================= 配置区 =================
        const API_KEY_PREFIX = "cfut_ArYBq017n4ATROfFMbKahr3NW0ilYowdLrL1zkiD9c421"; 
        
        // worker
        const API_URL = "https://h-555666.pages.dev/";
        
        // modelname
        const MODEL_NAME = "google-ai-studio/gemma-4-31b-it";
        // ==========================================

        let apiKeySuffix = ""; 
        let messagesHistory = []; 

        const chatHistory = document.getElementById('chat-history');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const modalOverlay = document.getElementById('modal-overlay');
        const keySuffixInput = document.getElementById('key-suffix');
        const saveKeyBtn = document.getElementById('save-key-btn');

        function appendMessage(role, content) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            msgDiv.innerText = content; 
            chatHistory.appendChild(msgDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight; 
        }

        async function fetchAIResponse() {
            const currentMessage = userInput.value.trim();
            if (!currentMessage) return;

            appendMessage('user', currentMessage);
            messagesHistory.push({ role: "user", content: currentMessage });
            userInput.value = "";
            sendBtn.disabled = true;
            appendMessage('system', 'AI 思考中...');

            try {
                const fullAuthHeader = `Bearer ${API_KEY_PREFIX}${apiKeySuffix}`;

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'cf-aig-authorization': fullAuthHeader,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: MODEL_NAME,
                        messages: messagesHistory
                    })
                });

                chatHistory.lastChild.remove(); 

                if (!response.ok) {
                    throw new Error(`状态码: ${response.status}`);
                }

                const data = await response.json();
                const aiReply = data.choices[0].message.content;

                appendMessage('assistant', aiReply);
                messagesHistory.push({ role: "assistant", content: aiReply });

            } catch (error) {
                messagesHistory.pop(); 
                if(chatHistory.lastChild.className.includes('system')) {
                    chatHistory.lastChild.remove();
                }
                appendMessage('system', `请求失败: ${error.message} (密码可能错误！)`);
                
                // 清空内存，要求重填
                apiKeySuffix = "";
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function handleSend() {
            if (!userInput.value.trim()) return;
            if (!apiKeySuffix || apiKeySuffix.length !== 3) {
                modalOverlay.style.display = 'flex'; 
                keySuffixInput.focus();
            } else {
                fetchAIResponse(); 
            }
        }

        saveKeyBtn.addEventListener('click', () => {
            const inputVal = keySuffixInput.value.trim();
            if (inputVal.length === 3) {
                apiKeySuffix = inputVal;
                modalOverlay.style.display = 'none';
                keySuffixInput.value = ''; 
                fetchAIResponse(); 
            } else {
                alert("请输入准确的 3 位后缀！");
            }
        });

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault(); 
                handleSend();
            }
        });
        keySuffixInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') saveKeyBtn.click();
        });
    </script>
</body>
</html>
